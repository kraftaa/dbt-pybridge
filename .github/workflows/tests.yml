name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        dbt: ["1.10", "1.11"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYBRIDGE_INTEGRATION_HOST: 127.0.0.1
      PYBRIDGE_INTEGRATION_PORT: "5432"
      PYBRIDGE_INTEGRATION_USER: postgres
      PYBRIDGE_INTEGRATION_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[federation]" pytest
          python -m pip install "dbt-core~=${{ matrix.dbt }}.0" "dbt-postgres~=${{ matrix.dbt }}.0"
      - name: Test
        run: pytest -q
